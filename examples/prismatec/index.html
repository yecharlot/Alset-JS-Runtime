<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Prism@.TEC · Tecnología, Finanzas y Consultoría · Guantánamo, Cuba</title>
  <meta name="description" content="Prism@.TEC: infraestructura tecnológica, consultoría financiera y asesoría académica. Creadores de la red Alset." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg: #121316;
      --bg-alt: #0d0e10;
      --surface: #1b1c21;
      --surface-2: #212328;
      --line: rgba(244,180,0,0.16);
      --gold: #F4B400;
      --amber: #FB8C00;
      --ember: #E4572E;
      --cyan: #00ACC1;
      --deep-blue: #0F4C63;
      --ink: #F5F3EE;
      --ink-muted: #ABA9A3;
      --serif: 'Fraunces', serif;
      --sans: 'Inter', sans-serif;
    }
    *{ margin:0; padding:0; box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    html, body{ width:100%; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6; overflow-x:hidden; }
    #app{ width:100%; min-height:100vh; display:flex; flex-direction:column; }
    ::selection{ background:var(--gold); color:#181818; }
    ::-webkit-scrollbar{ width:9px; }
    ::-webkit-scrollbar-track{ background:var(--bg-alt); }
    ::-webkit-scrollbar-thumb{ background:linear-gradient(var(--gold), var(--ember)); border-radius:10px; }
    a{ color:inherit; text-decoration:none; }
    .accent{
      background:linear-gradient(120deg, var(--gold) 10%, var(--amber) 45%, var(--ember) 75%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .serif{ font-family:var(--serif); font-weight:600; letter-spacing:-0.01em; line-height:1.1; }
    .btn-clip{
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    }
    .wa-hex{
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
    .facet-diamond{
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }
    @keyframes pulse {
      0%,100%{ opacity:0.7; transform:scale(1); }
      50%{ opacity:1; transform:scale(1.05); }
    }
    @keyframes floaty {
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-12px); }
    }
    input, textarea{
      width:100%; padding:13px 15px; background:var(--bg);
      border:1px solid var(--line); color:var(--ink);
      font-family:inherit; font-size:0.95rem; border-radius:0;
    }
    input:focus, textarea:focus{ outline:none; border-color:var(--gold); }
    input::placeholder, textarea::placeholder{ color:#6d6c68; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
